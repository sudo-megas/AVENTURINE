<?xml version="1.0" encoding="UTF-8"?>
<!-- Aventurine. An eyedropper, one colour, no gradients, scalable. -->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <g fill="#26a269">
    <!-- Drawn pointing straight down, then rotated so the tip falls to the
         lower left, which is how an eyedropper is normally shown. -->
    <g transform="rotate(45 32 32)">
      <rect x="23" y="7" width="18" height="13" rx="4.5"/>
      <rect x="28.5" y="20" width="7" height="23"/>
      <path d="M28.5 43 h7 l-3.5 10 z"/>
    </g>
  </g>
</svg>
